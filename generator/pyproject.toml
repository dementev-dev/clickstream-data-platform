[project]
name = "clickstream-generator"
version = "0.1.0"
description = "Генератор кликстрима учебного стенда: контракт схемы события и модельный мир"
readme = "README.md"
# Верхняя граница — не педантизм: обещание побайтовой воспроизводимости
# держится на зафиксированных версиях (спека генератора, раздел 2).
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2",
    "orjson>=3.11.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    # Типчекер; молод (0.0.x), но версия закреплена в uv.lock. Настройка
    # сверена с доками Astral через Context7: запуск `uv run ty check`,
    # правил по умолчанию пока достаточно.
    "ty>=0.0.65",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
