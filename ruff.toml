# Настройка ruff для кода стенда — дагов и Superset. У генератора своя,
# в `generator/pyproject.toml`: конфиг ruff ищется вверх по дереву от файла,
# поэтому ближний к генератору выигрывает и этот его не подменяет.
#
# Отдельный файл, а не `pyproject.toml`: пакета в корне нет и заводить его
# ради настройки линтера незачем.

# На каком Python побежит код, ruff сам не знает: у генератора он берёт ответ
# из `requires-python`, а у стенда спрашивать некого — даги и Superset живут
# внутри образов. Замер 9 августа 2026 года: `apache/airflow:3.3.0` несёт
# Python 3.13.14, `apache/superset:6.1.0` — 3.10.20. Стоит младшая из двух,
# иначе ruff предложил бы Superset синтаксис, которого его Python не знает.
# Даги за это платят: они бегут на 3.13, и модернизаций, доступных только там,
# ruff им не предложит. Значение совпадает с умолчанием ruff, и записано
# именно поэтому: сменится умолчание — проверка не поедет следом молча.
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B"]
