global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: clickhouse
    static_configs:
      - targets:
          - clickhouse-01:9363
          - clickhouse-02:9363
        labels:
          role: server
  - job_name: clickhouse-keeper
    static_configs:
      - targets:
          - clickhouse-keeper:9363
        labels:
          role: keeper
