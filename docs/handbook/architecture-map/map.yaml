title: Карта слоев хранилища
lead: Проследите, как один смысл меняет имя и поверхность между слоями.
chapter_url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/handbook/storage-layers.md#user-content-хранилище-и-его-слои
intro:
  - Эта карта показывает путь событий и заказов от Kafka до витрин DM.
  - Щелкните по узлу, чтобы увидеть его назначение, устройство и ключи.
  - Щелкните по стрелке, чтобы узнать, кто и каким запросом переносит данные.
  - Когда вы выбираете узел, карта подсвечивает все пути к нему и от него.
  - Переключатель потока приглушает другую часть карты, но не меняет раскладку.
  - Сначала прочитайте главу «Хранилище и его слои», затем вернитесь к карте и рассмотрите объекты.

streams:
  all: Все
  events: События
  orders: Заказы

dictionary:
  title: Словарь
  caption: 'сбоку цепочки: справочники'

layers:
  - id: kafka
    title: Kafka
    caption: откуда приходит
  - id: stg
    title: STG
    caption: как поступило
  - id: ods
    title: ODS
    caption: язык источника
  - id: dds
    title: DDS
    caption: язык бизнеса
  - id: dm
    title: DM
    caption: данные для дашбордов

mechanisms:
  - id: materialized_view
    label: матвью
    line: solid
    rhythm: непрерывно, по мере прихода сообщений
  - id: airflow_dag
    label: даг Airflow
    line: dashed
    rhythm: 'пачкой: раз в модельные сутки (`orders_ingest`) или на каждом прогоне конвейера'
  - id: view
    label: представление
    line: dotted
    rhythm: без копии, данные читаются на месте

nodes:
  - id: kafka_hits
    name: hits
    layer: kafka
    order: 0
    streams: [events]
    what: Топик Kafka с событиями кликстрима. Каждое сообщение содержит одно событие.
    read: 'Топик напрямую не читают: таблица `stg.hits_raw_kafka` забирает сообщения из топика. Для данных событий используйте `stg.hits_raw_dist`.'
    fill:
      - Источник событий пишет сообщения в топик в темпе выбранного режима мира.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/storage.md#user-content-при%D1%91м-поток-и-его-свойства
      - label: Формат
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/formats/clickstream-event.md#user-content-описание-выгрузки-событие-кликстрима

  - id: kafka_orders
    name: orders
    layer: kafka
    order: 1
    streams: [orders]
    what: Топик Kafka со слепками заказов магазина. После модельного дня приходит снимок изменяемого окна.
    read: 'Топик напрямую не читают: таблица `stg.orders_raw_kafka` забирает сообщения из топика. Для заказов используйте `stg.orders_raw_dist`.'
    fill:
      - Источник заказов публикует слепок пачкой после каждого модельного дня.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/orders/ingestion.md#user-content-поток-данных
      - label: Устройство слепка
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/orders/snapshot.md#user-content-слепок-и-его-доставка

  - id: stg_hits
    name: stg.hits_raw_dist
    layer: stg
    order: 0
    streams: [events]
    what: Сырая строка события и метаданные доставки. STG сохраняет сообщение без разбора.
    read: 'Читайте `_dist`: у STG нет представления `_v`, а распределенная таблица показывает оба шарда.'
    parts:
      - '`stg.hits_raw_kafka` — чтец топика `hits`.'
      - '`stg.hits_raw_rep` — реплицируемая таблица на шарде.'
      - '`stg.hits_raw_dist` — распределенная поверхность записи и чтения.'
      - '`stg.hits_raw_mv` — матвью приема сообщений из чтеца.'
    fill:
      - '`stg.hits_raw_mv` пишет непрерывно, по мере прихода сообщений.'
      - Сырые строки живут трое суток реального времени плюс хвост до суток.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/storage.md#user-content-при%D1%91м-поток-и-его-свойства
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/10-stg-tables.sql
      - label: DDL матвью
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/40-stg-views.sql

  - id: stg_orders
    name: stg.orders_raw_dist
    layer: stg
    order: 1
    streams: [orders]
    what: Сырые строки слепка заказов, метаданные доставки и идентификатор пачки `_load_id`.
    read: 'Читайте `_dist`: у STG нет представления `_v`, а распределенная таблица показывает оба шарда.'
    parts:
      - '`stg.orders_raw_kafka` — чтец топика `orders` на первой ноде.'
      - '`stg.orders_raw_rep` — реплицируемая таблица на шарде.'
      - '`stg.orders_raw_dist` — распределенная поверхность записи и чтения.'
    fill:
      - Задача `pull_batch` дага `orders_ingest` забирает слепок пачкой раз в модельные сутки.
      - Сырые строки живут трое суток реального времени плюс хвост до суток.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/orders/ingestion.md#user-content-поток-данных
      - label: DDL
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/10-stg-tables.sql

  - id: ods_event
    name: ods.event_v
    layer: ods
    order: 0
    streams: [events]
    what: Типизированное широкое событие с именами полей источника. Запрос представления с `FINAL` возвращает актуальную версию события.
    read: 'Читайте `ods.event_v`: запрос представления с `FINAL` возвращает актуальные строки вместо физических версий.'
    parts:
      - '`ods.event_rep` — реплицируемая таблица версий события на шарде.'
      - '`ods.event_dist` — распределенная поверхность записи и диагностики.'
      - '`ods.event_v` — представление актуального состояния с `FINAL`.'
      - '`ods.event_mv` — матвью разбора годных строк STG.'
    keys:
      - '`WatchID` — тот же идентификатор, что `event_id` в DDS.'
      - '`ClientID` — тот же посетитель, что `client_id` в DDS.'
      - '`EventDate` — тот же день, что `event_date` в DDS.'
    fill:
      - '`ods.event_mv` разбирает строки непрерывно, по мере записи в STG.'
      - '`ReplacingMergeTree(_load_ts)` хранит версии, а `FINAL` выбирает актуальную.'
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/storage.md#user-content-актуальные-события
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/20-ods-tables.sql
      - label: DDL представлений
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/30-ods-views.sql

  - id: ods_event_errors
    name: ods.event_errors_dist
    layer: ods
    order: 1
    streams: [events]
    what: Сырые события, которые не прошли строгий прием, с классом ошибки и метаданными доставки.
    read: 'Читайте `_dist`: представления `_v` нет, а распределенная таблица показывает ошибки с обоих шардов.'
    parts:
      - '`ods.event_errors_rep` — реплицируемая таблица ошибок на шарде.'
      - '`ods.event_errors_dist` — распределенная поверхность чтения и записи.'
      - '`ods.event_errors_mv` — матвью, которое отбирает негодные строки STG.'
    fill:
      - '`ods.event_errors_mv` пишет непрерывно, по мере записи в STG.'
      - Ошибки живут один месяц и не останавливают прием годных событий.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/storage.md#user-content-таблица-ошибок
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/20-ods-tables.sql
      - label: DDL матвью
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/30-ods-views.sql

  - id: ods_order
    name: ods.order_v
    layer: ods
    order: 2
    streams: [orders]
    what: Текущая версия заказа на языке источника. Позиции пока остаются сырым фрагментом JSON.
    read: 'Читайте `ods.order_v`: запрос представления с `FINAL` возвращает последнюю версию по `snapshot_date`.'
    parts:
      - '`ods.order_rep` — реплицируемая таблица версий заказа на шарде.'
      - '`ods.order_dist` — распределенная поверхность записи и диагностики.'
      - '`ods.order_v` — представление текущего состояния с `FINAL`.'
    keys:
      - '`order_id` — тот же заказ в `dds.order_v` и `dm.purchase_vs_orders_v`.'
      - '`user_id` — пользователь магазина, который переходит в заказ DDS.'
    fill:
      - Задача `parse_batch` дага `orders_ingest` разбирает пачку раз в модельные сутки.
      - '`ReplacingMergeTree(snapshot_date)` оставляет версию из последнего принятого слепка.'
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/storage.md#user-content-версии-заказов
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/20-ods-tables.sql
      - label: DDL представления
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/30-ods-views.sql

  - id: ods_order_errors
    name: ods.order_errors_dist
    layer: ods
    order: 3
    streams: [orders]
    what: Сырые строки слепка, которые не прошли строгий прием, с классом ошибки и `_load_id`.
    read: 'Читайте `_dist`: представления `_v` нет, а распределенная таблица показывает ошибки с обоих шардов.'
    parts:
      - '`ods.order_errors_rep` — реплицируемая таблица ошибок на шарде.'
      - '`ods.order_errors_dist` — распределенная поверхность чтения и записи.'
    fill:
      - Задача `parse_batch` дага `orders_ingest` пишет ошибки из той же пачки, что и годные заказы.
      - Ошибки живут один месяц и не останавливают прием годных заказов.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/storage.md#user-content-таблица-ошибок
      - label: DDL
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/20-ods-tables.sql

  - id: dds_event
    name: dds.event_v
    layer: dds
    order: 0
    streams: [events]
    what: Публичное представление события на языке бизнеса. Его запрос переименовывает поля и расшифровывает категорию устройства.
    read: 'Читайте `dds.event_v`: запрос представления возвращает явный список колонок DDS.'
    parts:
      - '`dds.event_v` — только представление над `ods.event_v`; своей таблицы в DDS нет.'
    keys:
      - '`event_id` — тот же идентификатор, что `WatchID` в ODS.'
      - '`client_id` — тот же посетитель, что `ClientID` в ODS; соединяет событие с сессией и картой идентичностей.'
      - '`event_date` — тот же день, что `EventDate` в ODS.'
      - '`purchase_id[1]` — тот же заказ, что `order_id` в DDS и DM.'
    fill:
      - Данные для `dds.event_v` читаются из актуальных событий ODS без копии и отдельного расписания.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/dds/event.md#user-content-форма
      - label: DDL
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/50-dds-views.sql

  - id: dds_session
    name: dds.session_v
    layer: dds
    order: 1
    streams: [events]
    what: Сессия, которую запрос дага `dds_transform` собирает из последовательных событий одной куки. В источнике готовой сессии нет.
    read: 'Читайте `dds.session_v`: запрос представления возвращает деловые и служебные колонки.'
    parts:
      - '`dds.session_rep` — реплицируемая таблица сессий на шарде.'
      - '`dds.session_dist` — распределенная поверхность загрузки и диагностики.'
      - '`dds.session_stage_rep` — донор дневных партиций на шарде.'
      - '`dds.session_stage_dist` — распределенная поверхность донора.'
      - '`dds.session_v` — публичное представление.'
    keys:
      - '`client_id` — тот же посетитель, что в событии DDS и карте идентичностей.'
      - '`session_date` — день, который в `dm.daily_traffic_v` называется `report_date`.'
    fill:
      - Даг `dds_transform` пересобирает данные прожитых дней при каждом прогоне конвейера.
      - Задачи `session.rebuild` и `session.replace` собирают день в доноре и заменяют партицию.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/dds/session.md#user-content-движок-и-наполнение
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/45-dds-tables.sql
      - label: DDL представления
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/50-dds-views.sql

  - id: dds_order
    name: dds.order_v
    layer: dds
    order: 2
    streams: [orders]
    what: Заказ в текущем состоянии на языке бизнеса. Артикулы, количества и цены позиций хранятся в согласованных массивах.
    read: 'Читайте `dds.order_v`: запрос представления возвращает данные без таблиц и донора партиций.'
    parts:
      - '`dds.order_rep` — реплицируемая таблица заказов на шарде.'
      - '`dds.order_dist` — распределенная поверхность загрузки и диагностики.'
      - '`dds.order_stage_rep` — донор дневных партиций на шарде.'
      - '`dds.order_stage_dist` — распределенная поверхность донора.'
      - '`dds.order_v` — публичное представление.'
    keys:
      - '`order_id` — тот же заказ, что в ODS, событии покупки и витрине сверки.'
      - '`user_id` — пользователь магазина, который входит в карту идентичностей.'
      - '`item_sku` — тот же артикул, что `sku` в `dic.products`.'
      - '`order_date` — день, который в витринах называется `report_date` или `order_day`.'
    fill:
      - Даг `dds_transform` пересобирает изменяемое окно при каждом прогоне конвейера.
      - Задачи `order.rebuild` и `order.replace` собирают дни в доноре и заменяют партиции.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/dds/order.md#user-content-движок-и-наполнение
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/45-dds-tables.sql
      - label: DDL представления
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/50-dds-views.sql

  - id: dds_identity
    name: dds.identity_map_v
    layer: dds
    order: 3
    streams: [events, orders]
    what: Известные пары куки трекера и пользователя магазина. Связь появляется после сопоставленной покупки.
    read: 'Читайте `dds.identity_map_v`: запрос представления с `FINAL` возвращает актуальные строки полного пересчета.'
    parts:
      - '`dds.identity_map_rep` — реплицируемая таблица версий пар на шарде.'
      - '`dds.identity_map_dist` — распределенная поверхность записи.'
      - '`dds.identity_map_v` — точное публичное представление с `FINAL`.'
    keys:
      - '`client_id` — кука из события и сессии DDS.'
      - '`user_id` — пользователь магазина из заказа DDS.'
    fill:
      - Задача `identity_map` дага `dds_transform` пересчитывает все известные пары после обновления заказов.
      - Новая версия полного набора пишется при каждом прогоне; `FINAL` скрывает физические повторы.
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/dds/identity.md#user-content-сборка
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/45-dds-tables.sql
      - label: DDL представления
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/50-dds-views.sql

  - id: dm_daily_traffic
    name: dm.daily_traffic_v
    layer: dm
    order: 0
    streams: [events]
    what: Дневные счетчики посетителей и известных пользователей после склейки идентичностей.
    read: 'Читайте `dm.daily_traffic_v`: запрос представления с `FINAL` возвращает актуальные строки полного пересчета.'
    parts:
      - '`dm.daily_traffic_rep` — реплицируемая таблица версий счетчиков.'
      - '`dm.daily_traffic_dist` — распределенная поверхность записи.'
      - '`dm.daily_traffic_v` — точное публичное представление с `FINAL`.'
    keys:
      - '`report_date` — тот же день, что `session_date` в сессии DDS.'
    fill:
      - Задача `daily_traffic` дага `dm_transform` при каждом прогоне пересчитывает всю историю и записывает новую версию.
      - '`FINAL` оставляет текущую строку каждого дня.'
    links:
      - label: Справочник
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/docs/architecture/dm.md#user-content-dmdaily_traffic_v
      - label: DDL таблиц
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/55-dm-tables.sql
      - label: DDL представления
        url: https://git.dementev.space/ddmitry/clickstream-data-platform/src/branch/main/sql/ddl/60-dm-views.sql

  - id: dm_revenue
    name: dm.revenue_daily_v
    layer: dm
    order: 1
    streams: [orders]
    what: Дневная выручка, число заказов и единиц товара по категориям.
    read: 'Читайте `dm.revenue_daily_v`: это публичное представление готовой дневной витрины.'
    parts:
      - '`dm.revenue_daily_rep` — реплицируемая таблица витрины на шарде.'
      - '`dm.revenue_daily_dist` — распределенная поверхность загрузки.'
      - '`dm.revenue_daily_stage_rep` — донор дневных партиций на шарде.'
